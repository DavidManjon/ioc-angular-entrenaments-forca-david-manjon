<form #formulari="ngForm" class="filters" (ngSubmit)="aplicarFiltres()">

  <div class="form-field">
    <label for="textCerca">Cerca d'exercicis:</label>

    <input
      id="textCerca"
      name="textCerca"
      type="text"
      [(ngModel)]="textCerca"
      required
      minlength="3"
      #camptext="ngModel"
      placeholder="Escriu almenys 3 caràcters"
    >

    @if (camptext.invalid && (camptext.dirty || camptext.touched)) {
      <small class="error">
        @if (camptext.errors?.['required']) {
          El camp de cerca és obligatori.
        } @else if (camptext.errors?.['minlength']) {
          El text ha de tenir com a mínim 3 caràcters.
        }
      </small>
    }
  </div>

  <div class="form-field">
    <label for="categoria">Categoria:</label>

    <select
      id="categoria"
      name="categoria"
      [(ngModel)]="categoriaSeleccionada"
    >
      @for (categoria of categories; track categoria) {
        <option [value]="categoria">{{ categoria }}</option>
      }
    </select>
  </div>

  <div class="form-actions">
    <button type="submit" [disabled]="formulari.invalid">
      Aplicar filtres
    </button>

    <button type="button" (click)="restablirFiltres()">
      Restablir filtres
    </button>
  </div>

</form>
