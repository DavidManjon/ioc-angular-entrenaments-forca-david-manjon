<div class="exercici-list">
  @if (exercicis.length === 0) {
    <p>No hi ha exercicis disponibles.</p>
  } @else {
    @for (exercici of exercicis; track exercici.id) {
      <app-exercici-card
        [exercici]="exercici"
        (seleccionat)="seleccionarExercici($event)"
      />
    }
  }
</div>
